<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glassworks reference dashboard</title>
<style>
  /* The Glassworks palette (glassworks.dev/brand): the panel's screens are night; sky and violet mean
     "on" or lit; no ember (Kiln's) and no green, amber or rose (status only). */
  :root { color-scheme: dark; --bg: #0a0b0f; --card: #16171c; --text: #f4f4f5; --muted: #a1a1aa; --accent: #38bdf8; --on: #a78bfa; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  #view { display: flex; gap: 8px; padding: 8px; align-items: flex-start; }
  .col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
</style>
</head>
<body>
<div id="view"></div>
<script src="workload.js"></script>
<script src="stats.js"></script>
<script src="tiers.js"></script>
<script src="refdash.js"></script>
</body>
</html>
