<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glassworks reference dashboard</title>
<style>
  :root { color-scheme: dark; --bg: #111318; --card: #1c1f26; --text: #e3e5ea; --muted: #9aa0ab; --accent: #03a9f4; --on: #ffc107; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  #tabs { display: flex; gap: 20px; padding: 0 16px; height: 48px; align-items: center; font-weight: 500; color: var(--muted); }
  #tabs b { color: var(--text); border-bottom: 2px solid var(--accent); padding: 13px 0; }
  #view { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; padding: 0 8px 8px; align-items: start; }
  .col { display: grid; gap: 8px; }
</style>
</head>
<body>
<div id="tabs"></div>
<div id="view"></div>
<script src="workload.js"></script>
<script src="stats.js"></script>
<script src="tiers.js"></script>
<script src="refdash.js"></script>
</body>
</html>
