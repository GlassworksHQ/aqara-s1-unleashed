name: Feature request
description: Something the panel should do that it doesn't.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Glassworks is opinionated on purpose: Home Assistant is the brain, ESPHome is the wire, and nothing gets installed in HA. Have a look at [Glassworks Principles](https://github.com/GlassworksHQ/aqara-s1-unleashed/blob/main/docs/principles.md) first. If a HA dashboard or automation can already do it, we'll probably point you there.

  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The thing you're trying to do on the panel or in Home Assistant, not just the solution.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: How it could work
      description: Optional. Entities, settings, screens, or how another project does it.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Installer
        - Dashboard and sign-in
        - ESPHome device in Home Assistant
        - Voice assistant
        - Music Assistant player
        - Screen, presence, brightness
        - Radio (Zigbee or Thread)
        - Updates
        - Wall base
        - Other
