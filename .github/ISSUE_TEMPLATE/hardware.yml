name: Hardware report
description: You tried S1 Unleashed on a model, firmware or wall base we haven't tested. Reports that it worked help too.
labels: ["hardware report"]
body:
  - type: markdown
    attributes:
      value: |
        Tested so far: MP-K03D on firmware 4.5.80 and the December 2025 firmware. The installer
        refuses hardware it doesn't recognise before it writes anything; if it did that, say so below.

  - type: dropdown
    id: model
    attributes:
      label: Panel model
      options:
        - MP-K03D (S1 Plus, wall-mounted)
        - JYMKP01LM (S1 Plus for China)
        - MP-K05D (S1 Plus Desktop)
        - Other
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: Aqara firmware version
      placeholder: 4.5.80
    validations:
      required: true

  - type: input
    id: region
    attributes:
      label: Where it was bought
      placeholder: Germany

  - type: dropdown
    id: base
    attributes:
      label: Wall base
      options:
        - None / not attached
        - 2-gang relay base (lumi.switch.agl003)
        - 3-gang relay base (lumi.switch.acn034)
        - Ethernet base
        - Other
    validations:
      required: true

  - type: dropdown
    id: result
    attributes:
      label: How far did it get?
      options:
        - Everything worked
        - Installed, but some features don't work
        - The installer refused the panel ("Unknown hardware")
        - The installer failed partway
        - Didn't try to install, reporting hardware details only
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details
      description: What worked, what didn't, and the installer's log if it stopped. Photos of the board or label are welcome.
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: S1 Kiosk version
      placeholder: 0.4.3
